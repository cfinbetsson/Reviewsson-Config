<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reviewsson for macOS</title>
    <meta name="description" content="Reviewsson — performance reviews, powered by your Jira data. Download for macOS." />
    <link rel="icon" type="image/png" href="appicon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --bg2: #e9eef5;
        --card: rgba(255, 255, 255, 0.72);
        --card-border: rgba(0, 0, 0, 0.08);
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #0a84ff;
        --accent-hover: #0060df;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0f;
          --bg2: #16161d;
          --card: rgba(28, 28, 34, 0.72);
          --card-border: rgba(255, 255, 255, 0.10);
          --text: #f5f5f7;
          --muted: #9a9aa2;
          --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 600px at 50% -10%, var(--bg2), transparent 60%),
          var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1rem;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 30rem;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        padding: 2.75rem 2rem 2rem;
        text-align: center;
      }

      .icon {
        width: 100px;
        height: 100px;
        margin: 0 auto 1.25rem;
        border-radius: 22px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
        display: block;
      }

      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
      .tagline { margin: 0.35rem 0 0; color: var(--muted); font-size: 1.05rem; }

      .download {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 1.75rem 0 0.6rem;
        padding: 0.85rem 1.7rem;
        font-size: 1.05rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border-radius: 12px;
        text-decoration: none;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      .download:hover { background: var(--accent-hover); }
      .download:active { transform: scale(0.98); }
      .download svg { width: 18px; height: 18px; }
      .download.disabled { background: var(--muted); pointer-events: none; opacity: 0.7; }

      .meta { color: var(--muted); font-size: 0.9rem; margin: 0.25rem 0 0; min-height: 1.2em; }

      .features {
        list-style: none;
        padding: 0;
        margin: 2rem 0 0;
        display: grid;
        gap: 0.6rem;
        text-align: left;
      }
      .features li {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--text);
        font-size: 0.95rem;
      }
      .features .check {
        flex: none;
        width: 20px; height: 20px;
        border-radius: 50%;
        background: rgba(10, 132, 255, 0.15);
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }

      .feed {
        margin: 2rem 0 0;
        padding-top: 1.25rem;
        border-top: 1px solid var(--card-border);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .feed a { color: inherit; }

      .spinner {
        width: 18px; height: 18px;
        border: 2px solid var(--muted);
        border-top-color: transparent;
        border-radius: 50%;
        display: inline-block;
        vertical-align: -3px;
        animation: spin 0.8s linear infinite;
        margin-right: 0.4rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="appicon.png" alt="Reviewsson app icon" width="100" height="100" />

      <h1>Reviewsson</h1>
      <p class="tagline">Performance reviews, powered by your Jira data.</p>

      <div id="download-area">
        <a class="download disabled" href="#" aria-disabled="true">
          <span class="spinner"></span> Loading…
        </a>
        <p class="meta">Fetching the latest version…</p>
      </div>

      <ul class="features">
        <li><span class="check">&#10003;</span> Pulls tickets &amp; metrics straight from Jira</li>
        <li><span class="check">&#10003;</span> AI-assisted review summaries</li>
        <li><span class="check">&#10003;</span> Secure, signed automatic updates</li>
      </ul>

      <p class="feed">
        Runs on macOS 14+ · Auto-updates via <a href="appcast.xml">appcast.xml</a>
      </p>
    </main>

    <script>
      // Reads the Sparkle appcast and links to the newest release's enclosure.
      const S = "http://www.andymatuschak.org/xml-namespaces/sparkle";
      const area = document.getElementById("download-area");

      const downloadIcon =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

      function text(item, localName) {
        const el = item.getElementsByTagNameNS(S, localName)[0];
        return el ? el.textContent.trim() : "";
      }

      function escapeAttr(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
        );
      }

      fetch("appcast.xml", { cache: "no-store" })
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then((xml) => {
          const doc = new DOMParser().parseFromString(xml, "application/xml");
          const items = [...doc.getElementsByTagName("item")];
          if (!items.length) throw new Error("no releases");

          // Newest = highest sparkle:version (integer CFBundleVersion).
          items.sort((a, b) => Number(text(b, "version")) - Number(text(a, "version")));
          const latest = items[0];

          const enclosure = latest.getElementsByTagName("enclosure")[0];
          const url = enclosure ? enclosure.getAttribute("url") : null;
          if (!url) throw new Error("no download");

          const shortVersion = text(latest, "shortVersionString") || text(latest, "version");
          const minOS = text(latest, "minimumSystemVersion");
          const pub = latest.getElementsByTagName("pubDate")[0];

          const parts = [];
          if (pub) parts.push("Released " + new Date(pub.textContent).toLocaleDateString());
          if (minOS) parts.push("macOS " + minOS + "+");

          area.innerHTML =
            '<a class="download" href="' + escapeAttr(url) + '">' +
              downloadIcon + " Download " + escapeAttr(shortVersion) +
            "</a>" +
            (parts.length ? '<p class="meta">' + parts.join(" · ") + "</p>" : "");
        })
        .catch(() => {
          area.innerHTML =
            '<a class="download disabled" href="appcast.xml">Latest release unavailable</a>' +
            '<p class="meta">See <a href="appcast.xml">appcast.xml</a></p>';
        });
    </script>
  </body>
</html>
